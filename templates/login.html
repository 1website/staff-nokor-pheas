<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចូលប្រើប្រាស់ប្រព័ន្ធ - រដ្ឋបាលឃុំនគរភាស</title>
  
  <!-- Favicons, App Icons & Desktop Shortcut Installation -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="application-name" content="រដ្ឋបាលឃុំនគរភាស">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="រដ្ឋបាលឃុំនគរភាស">
  <meta name="msapplication-TileColor" content="#1e3a8a">
  <meta name="msapplication-TileImage" content="{{ url_for('static', filename='img/icon-512x512.png') }}">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Moul&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260828-prod">
  
  <style>
    body {
      background: radial-gradient(circle at top right, #1e3a8a 0%, #0b192c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      padding: 30px 24px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }

    .login-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #c88a1a 0%, #fbbf24 100%);
    }

    .emblem-icon {
      width: 76px;
      height: 76px;
      background: #ffffff;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(251, 191, 36, 0.6);
      overflow: hidden;
    }

    .emblem-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-header h2 {
      font-family: var(--font-moul);
      font-size: 15px;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .login-header p {
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .login-body {
      padding: 28px 28px 24px;
    }

    .demo-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed var(--border-color);
    }

    .demo-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Global Loading Circle Overlay -->
  <div id="global-loading-overlay" class="global-loading-overlay" aria-hidden="true" style="display: none; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999999 !important; background: rgba(15, 23, 42, 0.75) !important; backdrop-filter: blur(8px) !important; -webkit-backdrop-filter: blur(8px) !important; align-items: center !important; justify-content: center !important;">
    <div class="loading-card">
      <div class="loading-circle-wrapper">
        <div class="loading-ring-outer"></div>
        <div class="loading-ring-inner"></div>
        <div class="loading-icon-center" style="width: 34px; height: 34px; border-radius: 50%; overflow: hidden;">
          <img src="{{ url_for('static', filename='img/app-icon.png') }}" alt="Logo" class="loading-pulse-icon" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
      </div>
      <div class="loading-text-group">
        <div id="global-loading-title" class="loading-title">កំពុងផ្ទៀងផ្ទាត់...</div>
        <div id="global-loading-subtitle" class="loading-subtitle">សូមរង់ចាំមួយភ្លែត ប្រព័ន្ធកំពុងដំណើរការចូលគណនី</div>
      </div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="emblem-icon">
        <img src="{{ url_for('static', filename='img/app-icon.png') }}" alt="រដ្ឋបាលឃុំនគរភាស">
      </div>
      <h2>រដ្ឋបាលឃុំនគរភាស</h2>
      <p>ប្រព័ន្ធគ្រប់គ្រងបុគ្គលិក និងរដ្ឋបាលថ្នាក់មូលដ្ឋាន</p>
    </div>

    <div class="login-body">
      <!-- Flash Messages Trigger for Toast -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="server-flash-message" data-category="{{ category }}" data-message="{{ message }}" style="display: none;"></div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fa-solid fa-user" style="color: var(--primary);"></i> ឈ្មោះគណនី (Username) <span class="required">*</span>
          </label>
          <input type="text" id="username" name="username" class="form-control" placeholder="បញ្ចូលឈ្មោះគណនី..." required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock" style="color: var(--primary);"></i> ពាក្យសម្ងាត់ (Password) <span class="required">*</span>
          </label>
          <input type="password" id="password" name="password" class="form-control" placeholder="បញ្ចូលពាក្យសម្ងាត់..." required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>ចូលប្រព័ន្ធ (Sign In)</span>
        </button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}?v=5.0"></script>
</body>
</html>
